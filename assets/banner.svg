<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.8" opacity="0.6"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#title-grad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tagline {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #64748b;
    }
    .pill-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    @keyframes pulse-slow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes float-particle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    .orb-1 {
      animation: pulse-slow 8s infinite ease-in-out;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulse-slow 10s infinite ease-in-out;
      transform-origin: 1000px 300px;
    }
    .particle-1 { animation: float-particle 6s infinite ease-in-out; }
    .particle-2 { animation: float-particle 8s infinite ease-in-out 1s; }
    .particle-3 { animation: float-particle 7s infinite ease-in-out 2s; }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Ambient Glowing Orbs in Background -->
  <circle class="orb-1" cx="180" cy="100" r="140" fill="#0284c7" opacity="0.25" filter="url(#glow)" />
  <circle class="orb-2" cx="1020" cy="300" r="160" fill="#7c3aed" opacity="0.25" filter="url(#glow)" />

  <!-- Subtle Tech Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Flow & Connection Lines (Background Dynamic Layer) -->
  <g opacity="0.3">
    <path d="M 100 200 Q 300 80, 600 200 T 1100 200" fill="none" stroke="url(#accent-cyan)" stroke-width="2" stroke-dasharray="6,6" />
    <path d="M 150 240 Q 450 360, 750 240 T 1050 240" fill="none" stroke="url(#accent-purple)" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- Floating Ambient Particles -->
  <circle class="particle-1" cx="320" cy="90" r="3" fill="#38bdf8" />
  <circle class="particle-2" cx="880" cy="110" r="4" fill="#a855f7" />
  <circle class="particle-3" cx="540" cy="340" r="3.5" fill="#06b6d4" />
  <circle class="particle-1" cx="950" cy="270" r="2.5" fill="#f43f5e" />

  <!-- Foreground Shield / Privacy Vault Icon -->
  <g transform="translate(110, 140)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <!-- Shield Graphic -->
    <path d="M 40 20 L 58 28 C 58 44 48 56 40 60 C 32 56 22 44 22 28 Z" fill="url(#accent-cyan)" opacity="0.9" />
    <!-- Checkmark / Lock pin -->
    <path d="M 34 38 L 38 42 L 47 33" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Foreground Content: Header & Titles -->
  <text class="title" x="220" y="180">Awesome DSAR &amp; Privacy</text>
  <text class="subtitle" x="220" y="215">Data Subject Access Request Automation &amp; Privacy Engineering</text>
  <text class="tagline" x="220" y="245">Curated Directory of Enterprise SaaS Solutions &amp; Open-Source Privacy Repositories</text>

  <!-- Dynamic Feature Badges / Pills -->
  <g transform="translate(220, 280)">
    <!-- Pill 1: GDPR & CCPA -->
    <g transform="translate(0, 0)">
      <rect width="130" height="32" rx="16" fill="#1e293b" stroke="#0284c7" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#38bdf8" />
      <text class="pill-text" x="28" y="21">GDPR &amp; CCPA</text>
    </g>

    <!-- Pill 2: DSAR Orchestration -->
    <g transform="translate(145, 0)">
      <rect width="170" height="32" rx="16" fill="#1e293b" stroke="#7c3aed" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#a855f7" />
      <text class="pill-text" x="28" y="21">DSAR Orchestration</text>
    </g>

    <!-- Pill 3: Consent Management -->
    <g transform="translate(330, 0)">
      <rect width="180" height="32" rx="16" fill="#1e293b" stroke="#059669" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#10b981" />
      <text class="pill-text" x="28" y="21">Consent Management</text>
    </g>

    <!-- Pill 4: Open Source -->
    <g transform="translate(525, 0)">
      <rect width="135" height="32" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#fbbf24" />
      <text class="pill-text" x="28" y="21">Open Source</text>
    </g>

    <!-- Pill 5: Market Intelligence -->
    <g transform="translate(675, 0)">
      <rect width="175" height="32" rx="16" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#f43f5e" />
      <text class="pill-text" x="28" y="21">Market Intelligence</text>
    </g>
  </g>
</svg>
